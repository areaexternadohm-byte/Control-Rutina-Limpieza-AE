<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina AE - Gestión Segura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { 
            --primary: #2c3e50; --accent: #3498db; --ok: #27ae60; --fail: #e74c3c; 
            --light-bg: #f8f9fa; --g-blue: #4285F4; --g-red: #EA4335; --g-yellow: #FBBC04; --g-green: #34A853;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; font-size: 0.82rem; }
        .app-title-header { font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.85rem; margin: 0; padding: 10px 5px; background-color: var(--primary); }
        
        /* Login */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 2.5rem; border-radius: 20px; width: 95%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); text-align: center; }
        .main-app { display: none; }

        /* Semáforo */
        .pct-low { color: var(--fail) !important; font-weight: 800; }
        .pct-high { color: var(--ok) !important; font-weight: 800; }

        /* Stats */
        .stats-card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 12px; border-top: 4px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stats-title { font-size: 0.80rem; font-weight: bold; color: var(--primary); text-transform: uppercase; margin-bottom: 8px; border-bottom: 2px solid #eee; padding-bottom: 4px; }
        .percent-val { font-size: 1.1rem; font-weight: bold; }
        .stat-row { display: flex; justify-content: space-between; padding: 2px 10px; border-bottom: 1px solid #f9f9f9; }

        /* Tabla */
        .table-responsive { background: white; border-radius: 10px; padding: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        th { background-color: var(--light-bg) !important; color: #000 !important; text-align: center; font-size: 0.58rem; vertical-align: middle; border: 1px solid #dee2e6 !important; font-weight: bold; padding: 6px 1px !important; }
        .sector-name { font-weight: 700; cursor: pointer; width: 78px !important; min-width: 78px !important; max-width: 78px !important; background: #f8f9fa; border-left: 4px solid transparent; text-align: left; padding: 6px 4px !important; color: var(--primary); font-size: 0.70rem; word-wrap: break-word; line-height: 1.1; }
        .sector-perc-label { font-size: 0.52rem; color: #7f8c8d; font-weight: normal; display: block; margin-top: 2px; line-height: 1; }
        
        .summary-col { background-color: #f1f8ff !important; font-weight: bold; color: #0366d6; width: 38px; border: 1px solid #dee2e6 !important; }
        .op-col { background-color: #fff3e0 !important; font-weight: bold; color: #e67e22; width: 38px; border: 1px solid #dee2e6 !important; }
        .op-mes-col { background-color: #fff8e1 !important; font-weight: bold; color: #ffa000; width: 38px; border: 1px solid #dee2e6 !important; }

        /* Tareas */
        .task-container { display: inline-block; position: relative; margin-top: 15px; }
        .operarios-num { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-weight: bold; font-size: 11px; color: #e67e22; background: #fff; border: 1px solid #e67e22; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; }
        .task-grid { display: grid; grid-template-columns: 1fr 1fr; width: 44px; height: 44px; border: 2px solid var(--primary); border-radius: 4px; overflow: hidden; background: #fff; }
        .task-cell { display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; border: 0.5px solid #ddd; background: white; cursor: pointer; height: 21px; user-select: none; }
        .task-ok { background-color: var(--ok) !important; color: white; }
        .task-fail { background-color: var(--fail) !important; color: white; }
        
        /* Bloqueo Visual */
        .day-locked { opacity: 0.6; pointer-events: none; background-color: #f2f2f2 !important; position: relative; }
        .day-locked::after { content: "🔒"; position: absolute; top: 0; right: 0; font-size: 8px; }

        .btn-google-drive { background: white !important; border: 2px solid transparent !important; border-image: linear-gradient(to bottom right, var(--g-blue), var(--g-green), var(--g-yellow), var(--g-red)) 1 !important; color: #5f6368 !important; font-weight: 700; font-size: 0.6rem; padding: 2px 6px; display: flex; align-items: center; gap: 4px; margin-right: 10px; }
        .readonly-mode { pointer-events: none; opacity: 0.7; filter: grayscale(0.3); }
        .legend-card { background: #fff; border-radius: 10px; padding: 8px; margin-bottom: 15px; border-left: 4px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h3 class="fw-bold mb-4" style="color: var(--primary)">Acceso Rutina AE</h3>
        <div class="text-start mb-3">
            <label class="small fw-bold">Usuario:</label>
            <select id="user-input" class="form-select" onchange="checkAdminField()">
                <option value="Tello Victoria">Tello Victoria</option>
                <option value="Torres Ramón">Torres Ramón</option>
                <option value="Administrador">👑 Administrador</option>
            </select>
        </div>
        <div id="admin-pass-container" class="text-start mb-4 d-none">
            <label class="small fw-bold text-danger">Contraseña Maestro:</label>
            <input type="password" id="pass-maestro" class="form-control" placeholder="••••••••">
        </div>
        <button class="btn btn-primary w-100 shadow fw-bold" onclick="manejarLogin()">INICIAR</button>
    </div>
</div>

<div class="main-app" id="app">
    <div class="text-center app-title-header no-print">Control de cumplimiento de rutina de limpieza AE</div>
    <nav class="navbar navbar-dark bg-dark px-3 shadow-sm no-print">
        <span class="navbar-brand mb-0 h6 small">Sesión: <b id="active-user-display"></b></span>
        <div class="d-flex align-items-center">
            <button id="google-btn" class="btn-google-drive" onclick="vincularGoogle()">
                <svg width="12" height="12" viewBox="0 0 87.3 78"><path d="m6.6 66.85 15.4-26.65c.7-1.25 1.9-2 3.25-2.2l31.25-.35c1.35.2 2.55.95 3.25 2.2l15.4 26.65c.7 1.25.7 2.75 0 4l-15.4 26.7c-.7 1.25-1.9 2-3.25 2.2h-31.25c-1.35-.2-2.55-.95-3.25-2.2l-15.4-26.7c-.7-1.25-.7-2.75 0-4z" fill="#0066da"/><path d="m30.65 24.35 15.4-26.65c.7-1.25 1.9-2 3.25-2.2h31.25c1.35.2 2.55.95 3.25 2.2l15.4 26.65c.7 1.25.7 2.75 0 4l-15.4 26.7c-.7 1.25-1.9 2-3.25 2.2l-31.25.35c-1.35-.2-2.55-.95-3.25-2.2l-15.4-26.7c-.7-1.25-.7-2.75 0-4z" fill="#00ac47"/><path d="m.7 75.3 15.4-26.7c.7-1.25 1.9-2 3.25-2.2h31.25c1.35.2 2.55.95 3.25 2.2l15.4 26.7c.7 1.25.7 2.75 0 4l-15.4 26.65c-.7 1.25-1.9 2-3.25 2.2h-31.25c-1.35-.2-2.55-.95-3.25-2.2l-15.4-26.65c-.7-1.25-.7-2.75 0-4z" fill="#ffba00"/></svg>
                DRIVE
            </button>
            <button class="btn btn-link text-white text-decoration-none btn-sm" onclick="location.reload()">Salir</button>
        </div>
    </nav>

    <div class="container-fluid py-3" id="app-content">
        <div id="perm-alert" class="alert py-1 text-center d-none" style="font-size: 0.7rem;"></div>

        <div class="row g-2">
            <div class="col-6">
                <div class="stats-card">
                    <div class="stats-title text-center">Semanal</div>
                    <div class="stat-row"><span class="small fw-bold">Total</span><span id="ps-total" class="percent-val">0%</span></div>
                    <div class="stat-row"><span>A</span><span id="ps-a" class="stat-num">0%</span></div>
                    <div class="stat-row"><span>B</span><span id="ps-b" class="stat-num">0%</span></div>
                    <div class="stat-row"><span>C</span><span id="ps-c" class="stat-num">0%</span></div>
                    <div class="stat-row"><span>D</span><span id="ps-d" class="stat-num">0%</span></div>
                </div>
            </div>
            <div class="col-6">
                <div class="stats-card">
                    <div class="stats-title text-center">Mensual</div>
                    <div class="stat-row"><span class="small fw-bold">Total</span><span id="pm-total" class="percent-val">0%</span></div>
                    <div class="stat-row"><span>A</span><span id="pm-a" class="stat-num">0%</span></div>
                    <div class="stat-row"><span>B</span><span id="pm-b" class="stat-num">0%</span></div>
                    <div class="stat-row"><span>C</span><span id="pm-c" class="stat-num">0%</span></div>
                    <div class="stat-row"><span>D</span><span id="pm-d" class="stat-num">0%</span></div>
                </div>
            </div>
        </div>

        <div class="row g-2 mb-3 no-print">
            <div class="col-6">
                <label class="small fw-bold">Viendo registros de:</label>
                <select id="view-user" class="form-select form-select-sm" onchange="renderMatriz()">
                    <option value="Tello Victoria">Tello Victoria</option>
                    <option value="Torres Ramón">Torres Ramón</option>
                </select>
                <input type="date" id="data-date" class="form-control form-control-sm mt-1" onchange="renderMatriz()">
            </div>
            <div class="col-6 d-flex gap-1 align-items-end">
                <button class="btn btn-sm btn-success w-100 fw-bold" onclick="exportarExcel()">EXCEL</button>
                <button class="btn btn-sm btn-danger w-100 fw-bold" onclick="exportarPDF()">PDF</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-sm align-middle text-center" id="main-table">
                <thead id="matriz-head"></thead>
                <tbody id="matriz-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>

<script>
    const CLIENT_ID = '92935134812-0iaa69fcipv69hqu5egfc20cdvblous2.apps.googleusercontent.com';
    const sectores = ["ALDE", "ALFA", "ALMA", "BOMB", "COFI", "FACU", "LABO", "LAEL", "MAES CH", "PERIM", "PUSI", "RECI", "RECU", "SETU", "SIDER", "TACE", "TAEL"];
    
    let db = JSON.parse(localStorage.getItem('db_ae_vFinal')) || {};
    let metas = JSON.parse(localStorage.getItem('metas_ae_vFinal')) || {};
    let activeUser = "";
    let tokenClient, accessToken = null, driveFileId = null;

    function checkAdminField() {
        document.getElementById('admin-pass-container').classList.toggle('d-none', document.getElementById('user-input').value !== "Administrador");
    }

    function manejarLogin() {
        const u = document.getElementById('user-input').value;
        if (u === "Administrador") {
            if (document.getElementById('pass-maestro').value !== "admin.ae") { alert("Contraseña incorrecta"); return; }
        }
        activeUser = u;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('active-user-display').innerText = activeUser;
        document.getElementById('view-user').value = (u === "Administrador") ? "Tello Victoria" : u;
        document.getElementById('data-date').valueAsDate = new Date();
        renderMatriz();
    }

    window.onload = () => {
        gapi.load('client', () => gapi.client.init({}));
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (resp) => { accessToken = resp.access_token; document.getElementById('google-btn').innerText = "✅ DRIVE OK"; syncDriveData(); },
        });
    };
    function vincularGoogle() { tokenClient.requestAccessToken({prompt: 'consent'}); }

    async function syncDriveData() {
        const r = await fetch('https://www.googleapis.com/drive/v3/files?q=name="rutina_ae_vFinal.json" and trashed=false', { headers: { Authorization: `Bearer ${accessToken}` } });
        const d = await r.json();
        if (d.files && d.files.length > 0) {
            driveFileId = d.files[0].id;
            const res = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, { headers: { Authorization: `Bearer ${accessToken}` } });
            db = await res.json(); renderMatriz();
        }
    }

    async function saveToDrive() {
        if (!accessToken) return;
        const metadata = { name: 'rutina_ae_vFinal.json', mimeType: 'application/json' };
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', new Blob([JSON.stringify(db)], { type: 'application/json' }));
        fetch(driveFileId ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart` : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: driveFileId ? 'PATCH' : 'POST', headers: { Authorization: `Bearer ${accessToken}` }, body: form
        });
    }

    function renderMatriz() {
        const head = document.getElementById('matriz-head'), body = document.getElementById('matriz-body');
        const selectedDate = new Date(document.getElementById('data-date').value);
        const viewSup = document.getElementById('view-user').value;
        const today = new Date(); today.setHours(0,0,0,0);
        
        // REGLA DE LECTURA: Si no soy admin y estoy viendo a otro supervisor
        const isAnotherSupervisor = (activeUser !== "Administrador" && activeUser !== viewSup);
        const alertBox = document.getElementById('perm-alert');
        alertBox.classList.remove('d-none');
        
        if (activeUser === "Administrador") {
            alertBox.innerHTML = "⚡ <b>MODO ADMINISTRADOR:</b> Control total habilitado.";
            alertBox.className = "alert alert-danger py-1 text-center";
        } else if (isAnotherSupervisor) {
            alertBox.innerHTML = "🔒 <b>MODO LECTURA:</b> Solo visualizas los datos de tu compañero.";
            alertBox.className = "alert alert-warning py-1 text-center";
        } else {
            alertBox.innerHTML = "✅ <b>MODO EDICIÓN:</b> Gestionando tus propios registros.";
            alertBox.className = "alert alert-info py-1 text-center";
        }

        const startDate = new Date(selectedDate);
        startDate.setDate(selectedDate.getDate() + 1);

        head.innerHTML = `<tr><th>Sector</th><th class="summary-col">V. Mes</th><th class="op-mes-col">Oper. Mes</th><th class="summary-col">V. Sem.</th><th class="op-col">Oper. Sem.</th>${[0,1,2,3,4,5,6].map(i => {
            let dt = new Date(startDate); dt.setDate(startDate.getDate() + i);
            return `<th>${dt.getDate()}/${dt.getMonth()+1}</th>`;
        }).join('')}</tr>`;

        body.innerHTML = '';
        sectores.forEach(sec => {
            let sumOpWeek = 0, countVisitsWeek = 0, sumOpMonth = 0, countVisitsMonth = 0, okWeek = 0, okMonth = 0, dayCells = "";
            
            for(let j=0; j<30; j++){
                let dM = new Date(startDate); dM.setDate(startDate.getDate() + j);
                let kM = `${sec}_${dM.toISOString().split('T')[0]}_${viewSup}`;
                let vM = db[kM];
                if(vM){
                    sumOpMonth += (parseInt(vM.op) || 0);
                    if(vM.op > 0 || vM.A !== null || vM.B !== null || vM.C !== null || vM.D !== null) countVisitsMonth++;
                    ['A','B','C','D'].forEach(t => { if(vM[t]===true) okMonth++; });
                }
            }

            for(let i=0; i<7; i++) {
                let dt = new Date(startDate); dt.setDate(startDate.getDate() + i);
                let fKey = dt.toISOString().split('T')[0];
                let k = `${sec}_${fKey}_${viewSup}`;
                let d = db[k] || { op: 0, A: null, B: null, C: null, D: null };
                
                sumOpWeek += (parseInt(d.op) || 0);
                if(d.op > 0 || d.A !== null || d.B !== null || d.C !== null || d.D !== null) countVisitsWeek++;
                ['A','B','C','D'].forEach(t => { if(d[t]===true) okWeek++; });

                // Lógica de Bloqueo: Bloqueado si es otro supervisor o si es pasado (y no soy admin)
                const isPast = dt < today;
                const bloqueado = (activeUser !== "Administrador") && (isAnotherSupervisor || isPast);

                dayCells += `<td><div class="task-container ${bloqueado ? 'day-locked' : ''}">
                    <div class="operarios-num" onclick="toggleOp('${k}')">${d.op}</div>
                    <div class="task-grid">
                        ${['A','B','C','D'].map(t => `<div class="task-cell ${d[t]===true?'task-ok':d[t]===false?'task-fail':''}" onclick="toggleTask('${k}','${t}')">${t}</div>`).join('')}
                    </div>
                </div></td>`;
            }

            let pS = Math.round((okWeek / 28) * 100), pM = Math.round((okMonth / 120) * 100);
            body.innerHTML += `<tr>
                <td class="sector-name">${sec}<span class="sector-perc-label">Sem: <span class="${pS < 60 ? 'pct-low' : 'pct-high'}">${pS}%</span></span><span class="sector-perc-label">Mes: <span class="${pM < 60 ? 'pct-low' : 'pct-high'}" style="color:var(--accent)">${pM}%</span></span></td>
                <td class="summary-col">${countVisitsMonth}</td><td class="op-mes-col">${sumOpMonth}</td><td class="summary-col">${countVisitsWeek}</td><td class="op-col">${sumOpWeek}</td>${dayCells}
            </tr>`;
        });
        updateStats(startDate);
    }

    function toggleTask(id, t) { if(!db[id]) db[id] = { op: 0, A: null, B: null, C: null, D: null }; db[id][t] = (db[id][t] === null) ? true : (db[id][t] === true ? false : null); save(); }
    function toggleOp(id) { if(!db[id]) db[id] = { op: 0, A: null, B: null, C: null, D: null }; db[id].op = (parseInt(db[id].op) + 1) % 5; save(); }
    function save() { localStorage.setItem('db_ae_vFinal', JSON.stringify(db)); renderMatriz(); saveToDrive(); }

    function updateStats(startDate) {
        const viewSup = document.getElementById('view-user').value;
        let s = { ok:0, A:0, B:0, C:0, D:0 }, m = { ok:0, A:0, B:0, C:0, D:0 };
        const totalPosSem = sectores.length * 7, totalPosMes = sectores.length * 30;

        sectores.forEach(sec => {
            for(let i=0; i<7; i++){
                let dt = new Date(startDate); dt.setDate(startDate.getDate() + i);
                let k = `${sec}_${dt.toISOString().split('T')[0]}_${viewSup}`;
                if(db[k]) ['A','B','C','D'].forEach(t => { if(db[k][t]===true) { s.ok++; s[t]++; } });
            }
            for(let j=0; j<30; j++){
                let dt = new Date(startDate); dt.setDate(startDate.getDate() + j);
                let k = `${sec}_${dt.toISOString().split('T')[0]}_${viewSup}`;
                if(db[k]) ['A','B','C','D'].forEach(t => { if(db[k][t]===true) { m.ok++; m[t]++; } });
            }
        });

        const fUI = (id, ok, total) => {
            const pct = total === 0 ? 0 : Math.round((ok/total)*100);
            const el = document.getElementById(id); el.innerText = pct + "%";
            el.className = pct < 60 ? (id.includes('total') ? 'percent-val pct-low' : 'pct-low') : (id.includes('total') ? 'percent-val pct-high' : 'pct-high');
        };

        fUI('ps-total', s.ok, totalPosSem * 4);
        ['A','B','C','D'].forEach(t => fUI('ps-'+t.toLowerCase(), s[t], totalPosSem));
        fUI('pm-total', m.ok, totalPosMes * 4);
        ['A','B','C','D'].forEach(t => fUI('pm-'+t.toLowerCase(), m[t], totalPosMes));
    }

    function exportarExcel() {
        let rows = [["Sector", "Fecha", "Supervisor", "A", "B", "C", "D", "Operarios"]];
        Object.keys(db).forEach(k => { let p = k.split('_'); rows.push([p[0], p[1], p[2], db[k].A?'OK':'F', db[k].B?'OK':'F', db[k].C?'OK':'F', db[k].D?'OK':'F', db[k].op]); });
        XLSX.utils.book_append_sheet(XLSX.utils.book_new(), XLSX.utils.aoa_to_sheet(rows), "Limpieza").window?.XLSX.writeFile(`Rutina_AE.xlsx`);
    }

    function exportarPDF() { html2pdf().set({ margin: 0.1, filename: 'Rutina_AE.pdf', jsPDF: { orientation: 'landscape' } }).from(document.getElementById('app-content')).save(); }
    setInterval(saveToDrive, 60000);
</script>
</body>
</html>
