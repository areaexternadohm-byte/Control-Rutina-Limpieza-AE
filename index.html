<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina AE - Gestión Integral</title>
    <!-- Librerías Críticas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        :root { 
            --primary: #2c3e50; --accent: #3498db; --ok: #27ae60; --fail: #e74c3c; 
            --light-bg: #f8f9fa; --looker-blue: #4285F4; --warning: #f1c40f;
            --today-highlight: #fff59d; 
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; font-size: 0.82rem; }
        .app-title-header { font-weight: 800; color: #fff; text-transform: uppercase; font-size: 0.85rem; padding: 10px; background-color: var(--primary); text-align: center; }

        /* Login */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 2.5rem; border-radius: 20px; width: 95%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center; }
        .main-app, #historial-section { display: none; }

        /* Semáforo */
        .pct-low { color: var(--fail) !important; font-weight: 800; }
        .pct-high { color: var(--ok) !important; font-weight: 800; }

        /* Stats */
        .stats-card { background: white; border-radius: 10px; padding: 10px; margin-bottom: 10px; border-top: 4px solid var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stats-title { font-size: 0.80rem; font-weight: bold; color: var(--primary); text-transform: uppercase; margin-bottom: 5px; border-bottom: 2px solid #eee; padding-bottom: 4px; text-align: center; }
        .percent-val { font-size: 1.1rem; font-weight: bold; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f2f2f2; padding: 4px 5px; font-size: 0.72rem; }

        /* Matriz Sticky */
        .table-responsive { background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-height: 70vh; overflow: auto; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        thead th { position: sticky; top: 0; background-color: #fff !important; z-index: 20; border-bottom: 2px solid #dee2e6 !important; }
        .sector-name { position: sticky; left: 0; background: #fff !important; z-index: 21; border-right: 2px solid #dee2e6 !important; font-weight: 700; width: 78px !important; min-width: 78px !important; font-size: 0.68rem; word-wrap: break-word; text-align: left; padding: 5px !important; border-left: 4px solid transparent; }
        .sector-perc-stack { display: block; font-size: 0.52rem; line-height: 1.1; margin-top: 2px; font-weight: normal; }
        
        .today-col { background-color: var(--today-highlight) !important; }
        .summary-col { background-color: #f1f8ff !important; font-weight: bold; font-size: 0.6rem; width: 35px; border: 1px solid #ddd !important; }
        .op-col { background-color: #fff3e0 !important; color: #e67e22; font-size: 0.6rem; width: 35px; border: 1px solid #ddd !important; }

        /* Tareas */
        .day-cell-container { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 0; }
        .op-box { font-size: 0.62rem; font-weight: bold; color: #e67e22; cursor: pointer; border: 1px solid #e67e22; padding: 0 4px; border-radius: 3px; background: #fff; }
        .task-grid { display: grid; grid-template-columns: 1fr 1fr; width: 42px; height: 42px; border: 1.5px solid var(--primary); border-radius: 3px; overflow: hidden; background: #fff; }
        .task-cell { display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; border: 0.5px solid #eee; background: white; height: 20px; cursor: pointer; user-select: none; }
        .task-ok { background-color: var(--ok) !important; color: white; }
        .task-fail { background-color: var(--fail) !important; color: white; }
        
        /* Bloqueos */
        .day-locked { opacity: 0.5; pointer-events: none !important; background-color: #f2f2f2 !important; position: relative; }
        .day-locked::after { content: "🔒"; position: absolute; top: 0; right: 0; font-size: 7px; }
        .readonly-mode { pointer-events: none !important; }

        /* ALERTAS VERDES */
        .btn-date-comment { display: inline-block; padding: 1px 3px; font-size: 10px; background: var(--warning); border: 1px solid #d4ac0d; border-radius: 3px; cursor: pointer; margin-top: 2px; color: #000; }
        .btn-date-comment.has-content { background: var(--ok) !important; color: white !important; border-color: #1e8449 !important; font-weight: bold; }
        
        .btn-note { font-size: 0.7rem; color: var(--accent); cursor: pointer; border: none; background: none; float: right; }
        .has-note .btn-note { color: var(--ok) !important; font-weight: bold; }

        .btn-dashboard { background-color: var(--looker-blue) !important; color: white !important; font-weight: 800; font-size: 0.65rem; height: 31px; border: none; }
        #sync-status-icon { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #ee5253; margin-right: 5px; }
        .sync-active { background: #10ac84 !important; box-shadow: 0 0 5px #10ac84; }
    </style>
</head>
<body>

<!-- MODAL NOTAS -->
<div id="commentModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h6 class="modal-title fw-bold">Nota del día: <span id="modal-date-display"></span></h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><textarea id="daily-comment-text" class="form-control" rows="4" placeholder="Escriba las alertas detectadas hoy..."></textarea></div>
            <div class="modal-footer"><button type="button" class="btn btn-primary w-100" id="save-comment-btn" onclick="saveDailyComment()">GUARDAR</button></div>
        </div>
    </div>
</div>

<div id="login-screen">
    <div class="login-card">
        <h4 class="fw-bold mb-4" style="color: var(--primary)">Control Rutina AE</h4>
        <div class="text-start mb-3">
            <label class="small fw-bold">Usuario:</label>
            <select id="user-input" class="form-select">
                <option value="Tello Victoria">Tello Victoria</option>
                <option value="Torres Ramón">Torres Ramón</option>
                <option value="Administrador">👑 Administrador</option>
            </select>
        </div>
        <div id="admin-field" class="text-start mb-4 d-none">
            <label class="small fw-bold text-danger">Contraseña Maestro:</label>
            <input type="password" id="pass-maestro" class="form-control" placeholder="••••••••">
        </div>
        <button class="btn btn-primary w-100 shadow fw-bold py-2" onclick="manejarLogin()">INICIAR</button>
        <p class="small text-muted mt-3">Cuenta: areaexterna.dohm@gmail.com</p>
    </div>
</div>

<div class="main-app" id="app">
    <div class="app-title-header no-print">Control de cumplimiento de rutina de limpieza AE</div>
    <nav class="navbar navbar-dark bg-dark px-2 shadow-sm no-print">
        <span class="text-white small">Sesión: <b id="active-user-display"></b></span>
        <div class="d-flex align-items-center gap-2">
            <div class="text-white extra-small" style="font-size: 0.6rem;"><span id="sync-status-icon"></span> DRIVE</div>
            <button class="btn btn-sm btn-info text-white fw-bold" onclick="mostrarHistorial()" style="font-size: 0.6rem;">HISTORIAL</button>
            <button class="btn btn-danger btn-sm" onclick="location.reload()">Salir</button>
        </div>
    </nav>

    <div class="container-fluid py-2" id="main-content">
        <div class="row g-2 mb-2">
            <div class="col-6"><div class="stats-card"><div class="stats-title">Semanal</div><div class="stat-row"><span class="small fw-bold">Total</span><span id="ps-total" class="percent-val">0%</span></div><div class="stat-row"><span>A:Pisos</span><span id="ps-a">0%</span></div><div class="stat-row"><span>B:Vidrios</span><span id="ps-b">0%</span></div><div class="stat-row"><span>C:Bolseo</span><span id="ps-c">0%</span></div><div class="stat-row"><span>D:Hidro</span><span id="ps-d">0%</span></div></div></div>
            <div class="col-6"><div class="stats-card"><div class="stats-title">Mensual (30d)</div><div class="stat-row"><span class="small fw-bold">Total</span><span id="pm-total" class="percent-val">0%</span></div><div class="stat-row"><span>A:Pisos</span><span id="pm-a">0%</span></div><div class="stat-row"><span>B:Vidrios</span><span id="pm-b">0%</span></div><div class="stat-row"><span>C:Bolseo</span><span id="pm-c">0%</span></div><div class="stat-row"><span>D:Hidro</span><span id="pm-d">0%</span></div></div></div>
        </div>

        <div class="row g-2 mb-2 no-print align-items-center">
            <div class="col-4"><select id="view-user" class="form-select form-select-sm" onchange="renderMatriz()"><option value="Tello Victoria">Victoria</option><option value="Torres Ramón">Ramón</option><option value="Todos">👥 Todos</option></select></div>
            <div class="col-4"><input type="date" id="data-date" class="form-control form-control-sm" onchange="renderMatriz()"></div>
            <div class="col-4"><button class="btn btn-sm w-100 btn-primary rounded shadow-sm" style="background-color:#4285F4; border:none; font-size:0.6rem;" onclick="window.open('https://lookerstudio.google.com/reporting/TU_ID_AQUI')">📊 DASHBOARD</button></div>
        </div>

        <div class="table-responsive">
            <table class="table table-sm align-middle text-center" id="main-table">
                <thead id="matriz-head"></thead>
                <tbody id="matriz-body"></tbody>
            </table>
        </div>
    </div>

    <div class="container-fluid py-2" id="historial-section">
        <div class="d-flex justify-content-between align-items-center mb-2"><h6>Historial</h6><button class="btn btn-secondary btn-sm" onclick="cerrarHistorial()">Volver</button></div>
        <div id="historial-body-list" class="list-group shadow-sm"></div>
    </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>

<script>
    const CLIENT_ID = '92935134812-0iaa69fcipv69hqu5egfc20cdvblous2.apps.googleusercontent.com';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzD4fRe08h2a8yNqcHwXY-qxEmiRmlezpGKfylApq7skJI2qoj4CvhTai-VZYQq5UNsqQ/exec';
    const sectores = ["ALDE", "ALDE LAV", "ALFA", "ALMA", "BOMB", "COFI", "FACU", "LABO", "LAEL", "LAFI", "LC1C", "LC1F", "LC2C", "LC2F", "MAES CH", "PERIM", "PREMIUM", "PUSI", "RECI", "RECU", "SETU", "SIAC", "SIDER", "TACE", "TAEL", "TAUT"];
    const diasNom = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    const creds = { "Administrador": "admin.ae" };
    
    let db = JSON.parse(localStorage.getItem('db_ae_vFinalPlanilla')) || {};
    let activeUser = "", accessToken = null, driveFileId = null, tokenClient;

    document.getElementById('user-input').onchange = function() {
        document.getElementById('admin-field').classList.toggle('d-none', this.value !== "Administrador");
    };

    function manejarLogin() {
        const u = document.getElementById('user-input').value;
        if (u === "Administrador" && document.getElementById('pass-maestro').value !== "admin.ae") { alert("Clave error"); return; }
        activeUser = u;
        tokenClient.requestAccessToken({ prompt: 'consent', login_hint: 'areaexterna.dohm@gmail.com' });
    }

    function entrarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('active-user-display').innerText = activeUser;
        document.getElementById('view-user').value = (activeUser === "Administrador") ? "Todos" : activeUser;
        const hoy = new Date();
        document.getElementById('data-date').value = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
        renderMatriz();
    }

    window.onload = () => {
        gapi.load('client', () => gapi.client.init({}));
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (resp) => { if (resp.access_token) { accessToken = resp.access_token; document.getElementById('sync-status-icon').classList.add('sync-active'); syncDriveData().then(() => entrarApp()); } },
        });
    };

    async function syncDriveData() {
        try {
            const r = await fetch('https://www.googleapis.com/drive/v3/files?q=name="rutina_ae_vFinal.json" and trashed=false', { headers: { Authorization: `Bearer ${accessToken}` } });
            const d = await r.json();
            if (d.files && d.files.length > 0) {
                driveFileId = d.files[0].id;
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, { headers: { Authorization: `Bearer ${accessToken}` } });
                db = await res.json();
            }
        } catch(e) { console.error(e); }
    }

    async function save(key) {
        localStorage.setItem('db_ae_vFinalPlanilla', JSON.stringify(db));
        renderMatriz();
        if (accessToken) {
            const metadata = { name: 'rutina_ae_vFinal.json', mimeType: 'application/json' };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([JSON.stringify(db)], { type: 'application/json' }));
            fetch(driveFileId ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart` : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                method: driveFileId ? 'PATCH' : 'POST', headers: { Authorization: `Bearer ${accessToken}` }, body: form
            }).then(r => r.json()).then(res => { if(!driveFileId) driveFileId = res.id; });
        }
    }

    function renderMatriz() {
        const head = document.getElementById('matriz-head'), body = document.getElementById('matriz-body');
        const startDateStr = document.getElementById('data-date').value;
        const startDate = new Date(startDateStr + "T00:00:00");
        const viewSup = document.getElementById('view-user').value;
        const today = new Date(); today.setHours(0,0,0,0);
        const todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
        const isReadonly = (viewSup === "Todos" || (activeUser !== "Administrador" && activeUser !== viewSup));
        body.className = isReadonly ? 'readonly-mode' : '';

        // HEADER
        let hContent = `<tr><th class="sector-name">Sector</th><th class="summary-col">V. Mes</th><th class="op-mes-col">O. Mes</th><th class="summary-col">V. Sem</th><th class="op-col">O. Sem</th>`;
        for(let i=0; i<7; i++) {
            let dt = new Date(startDate); dt.setDate(startDate.getDate() + i);
            let ds = dt.toISOString().split('T')[0];
            let isT = (ds === todayStr);
            
            // LÓGICA DE COMENTARIO VERDE
            let hasC = "";
            if(viewSup === "Todos") {
                hasC = (db['comment_'+ds+'_Tello Victoria'] || db['comment_'+ds+'_Torres Ramón']) ? 'has-content' : '';
            } else {
                hasC = db['comment_'+ds+'_'+viewSup] ? 'has-content' : '';
            }
            
            let btn = (viewSup === "Todos") ? "" : `<br><button class="btn-date-comment ${hasC}" onclick="openCommentModal('${ds}')">💬</button>`;
            hContent += `<th class="${isT ? 'today-col' : ''}">${diasNom[dt.getDay()]}<br>${dt.getDate()}/${dt.getMonth()+1}${btn}</th>`;
        }
        head.innerHTML = hContent + `</tr>`;

        // BODY
        body.innerHTML = '';
        sectores.forEach(sec => {
            let sumOpW = 0, vW = 0, sumOpM = 0, vM = 0, okW = 0, okM = 0, dayCells = "";
            let sups = (viewSup === "Todos") ? ["Tello Victoria", "Torres Ramón"] : [viewSup];
            const secKeyGlobal = `${sec}_${viewSup}`;
            
            for(let j=0; j<30; j++){
                let dM = new Date(startDate); dM.setDate(startDate.getDate() + j);
                let dsM = dM.toISOString().split('T')[0];
                let combM = { op: 0, act: false, ok: 0 };
                sups.forEach(s => {
                    let k = `${sec}_${dsM}_${s}`;
                    if(db[k]){
                        combM.op += (parseInt(db[k].op) || 0);
                        if(db[k].op > 0 || db[k].A!==null) combM.act = true;
                        ['A','B','C','D'].forEach(t => { if(db[k][t]===true) combM.ok++; });
                    }
                });
                sumOpM += combM.op; if(combM.act) vM++; okM += combM.ok;
            }
            for(let i=0; i<7; i++) {
                let dt = new Date(startDate); dt.setDate(startDate.getDate() + i);
                let ds = dt.toISOString().split('T')[0];
                let isT = (ds === todayStr);
                let combW = { op: 0, act: false, tasks: {A:null,B:null,C:null,D:null} };
                sups.forEach(s => {
                    let k = `${sec}_${ds}_${s}`;
                    if(db[k]){
                        combW.op += (parseInt(db[k].op) || 0);
                        if(db[k].op > 0 || db[k].A!==null) combW.act = true;
                        ['A','B','C','D'].forEach(t => {
                            if(db[k][t]===true) combW.tasks[t] = true;
                            else if(db[k][t]===false && combW.tasks[t]!==true) combW.tasks[t] = false;
                        });
                    }
                });
                sumOpW += combW.op; if(combW.act) vW++; ['A','B','C','D'].forEach(t => { if(combW.tasks[t]===true) okW++; });
                const bloqueado = (activeUser !== "Administrador") && (isReadonly || !isT);
                let kF = `${sec}_${ds}_${sups[0]}`;
                dayCells += `<td class="${isT ? 'today-col' : ''}"><div class="day-cell-container ${bloqueado ? 'day-locked' : ''}"><div class="op-box" onclick="toggleOp('${kF}')">${getCombOp(sec, ds, sups)}</div><div class="task-grid">${['A', 'B', 'C', 'D'].map(t => `<div class="task-cell ${combW.tasks[t]===true?'task-ok':combW.tasks[t]===false?'task-fail':''}" onclick="toggleTask('${kF}','${t}')">${t}</div>`).join('')}</div></div></td>`;
            }
            function getCombOp(s, d, su) { let o=0; su.forEach(u=>{ let k=`${s}_${d}_${u}`; if(db[k]) o+=parseInt(db[k].op)||0; }); return o; }

            let pS = Math.round((okW/28)*100), pM = Math.round((okM/120)*100);
            
            // LÓGICA DE NOTA VERDE
            let hasNoteClass = db['note_'+secKeyGlobal] ? 'has-note' : '';
            
            body.innerHTML += `<tr class="${hasNoteClass}">
                <td class="sector-name">${sec} <button class="btn-note" onclick="editNote('${secKeyGlobal}')">📝</button>
                    <span class="sector-perc-stack">Sem: <span class="${pS<60?'pct-low':'pct-high'}">${pS}%</span></span>
                    <span class="sector-perc-stack">Mes: <span class="${pM<60?'pct-low':'pct-high'}">${pM}%</span></span>
                </td>
                <td class="summary-col">${vM}</td><td class="op-col">${sumOpM}</td><td class="summary-col">${vW}</td><td class="op-col">${sumOpW}</td>${dayCells}
            </tr>`;
        });
        updateStats(startDate);
    }

    function editNote(secKey) {
        if(activeUser !== "Administrador" && !secKey.endsWith(activeUser)) return;
        const n = prompt("Novedad:", db['note_'+secKey] || "");
        if(n !== null) { db['note_'+secKey] = n; save('dummy'); }
    }

    function toggleOp(id) { 
        if(!db[id]) db[id] = { op: 0, A: null, B: null, C: null, D: null }; 
        let current = parseInt(db[id].op) || 0;
        if (current < 4) db[id].op = current + 1;
        else { let input = prompt("Operarios:", current); if (input !== null) { let n = parseInt(input); if(!isNaN(n) && n < 100) db[id].op = n; } }
        save(id); 
    }
    function toggleTask(id, t) { if(!db[id]) db[id] = { op: 0, A: null, B: null, C: null, D: null }; db[id][t] = (db[id][t] === null) ? true : (db[id][t] === true ? false : null); save(id); }
    
    function openCommentModal(d) {
        const viewSup = document.getElementById('view-user').value;
        const dObj = new Date(d + "T00:00:00"); const today = new Date(); today.setHours(0,0,0,0);
        const dsToday = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
        document.getElementById('modal-date-display').innerText = d;
        document.getElementById('daily-comment-text').value = db['comment_'+d+'_'+viewSup] || "";
        const canSave = (activeUser === "Administrador" || (d === dsToday && activeUser === viewSup));
        document.getElementById('save-comment-btn').style.display = canSave ? 'block' : 'none';
        document.getElementById('daily-comment-text').readOnly = !canSave;
        new bootstrap.Modal(document.getElementById('commentModal')).show();
    }
    function saveDailyComment() {
        const d = document.getElementById('modal-date-display').innerText, v = document.getElementById('view-user').value;
        db['comment_'+d+'_'+v] = document.getElementById('daily-comment-text').value;
        save('comment_sync');
        bootstrap.Modal.getInstance(document.getElementById('commentModal')).hide();
    }

    function updateStats(startDate) {
        const viewSup = document.getElementById('view-user').value;
        let s = { ok:0, a:0, b:0, c:0, d:0 }, m = { ok:0, a:0, b:0, c:0, d:0 };
        const sups = (viewSup === "Todos") ? ["Tello Victoria", "Torres Ramón"] : [viewSup];
        sectores.forEach(sec => {
            for(let i=0; i<7; i++){
                let dt = new Date(startDate); dt.setDate(startDate.getDate() + i);
                let ds = dt.toISOString().split('T')[0];
                let dOk = { A:false, B:false, C:false, D:false };
                sups.forEach(sup => { let k = `${sec}_${ds}_${sup}`; if(db[k]) ['A','B','C','D'].forEach(t => { if(db[k][t]===true) dOk[t]=true; }); });
                ['A','B','C','D'].forEach(t => { if(dOk[t]) s.ok++, s[t.toLowerCase()]++; });
            }
            for(let j=0; j<30; j++){
                let dt = new Date(startDate); dt.setDate(startDate.getDate() + j);
                let ds = dt.toISOString().split('T')[0];
                let mOk = { A:false, B:false, C:false, D:false };
                sups.forEach(sup => { let k = `${sec}_${ds}_${sup}`; if(db[k]) ['A','B','C','D'].forEach(t => { if(db[k][t]===true) mOk[t]=true; }); });
                ['A','B','C','D'].forEach(t => { if(mOk[t]) m.ok++, m[t.toLowerCase()]++; });
            }
        });
        const f = (id, ok, total) => {
            const pct = Math.round((ok/total)*100) || 0;
            const el = document.getElementById(id); el.innerText = pct + "%";
            el.className = pct < 60 ? 'percent-val pct-low' : 'percent-val pct-high';
        };
        const totalS = sectores.length * 28, totalM = sectores.length * 120;
        f('ps-total', s.ok, totalS); f('pm-total', m.ok, totalM);
        ['a','b','c','d'].forEach(t => { 
            let pS = Math.round((s[t]/(sectores.length*7))*100)||0, pM = Math.round((m[t]/(sectores.length*30))*100)||0;
            document.getElementById('ps-'+t).innerText = pS+"%"; document.getElementById('ps-'+t).className = pS < 60 ? 'pct-low' : 'pct-high';
            document.getElementById('pm-'+t).innerText = pM+"%"; document.getElementById('pm-'+t).className = pM < 60 ? 'pct-low' : 'pct-high';
        });
    }

    function mostrarHistorial() {
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('historial-section').style.display = 'block';
        const list = document.getElementById('historial-body-list'); list.innerHTML = "";
        Object.keys(db).filter(k => k.includes('_20')).sort().reverse().slice(0,100).forEach(k => {
            const p = k.split('_'); const d = db[k];
            list.innerHTML += `<div class="list-group-item small"><b>${p[1]}</b> - ${p[0]} (${p[2]}) | Tareas: A:${d.A?'OK':'F'} B:${d.B?'OK':'F'} C:${d.C?'OK':'F'} D:${d.D?'OK':'F'} | Op: ${d.op}</div>`;
        });
    }
    function cerrarHistorial() { document.getElementById('main-content').style.display = 'block'; document.getElementById('historial-section').style.display = 'none'; }
</script>
</body>
